---
#
# Symlinks to enable sending notifications to certain target when notification are enabled for an analysis phase in NGS_Automated.
#
group_notification_targets:
  ######################################################################################################################
  # umcg-atd group
  ######################################################################################################################
  - group: umcg-atd
    lfs: tmp07
    user: umcg-atd-ateambot
    type: notification_webhooks
    analysis_phases: [startPipeline, ConcordanceCheck, pipeline, calculateProjectMd5s, startNanoporePipeline, startPostDragenPipeline, startInhouseDragenPipeline]
    notification_target: hpc-helpdesk
    machines: "{{ groups['user_interface'] }}"
  - group: umcg-atd
    lfs: dat07
    user: umcg-atd-dm
    type: notification_webhooks
    analysis_phases: [moveAndCheckSamplesheets]
    notification_target: hpc-helpdesk
    machines: "{{ groups['chaperone'] }}"
  - group: umcg-atd
    lfs: prm07
    user: umcg-atd-dm
    type: notification_webhooks
    analysis_phases: [copyRawDataToPrm, copyRawDataToTmp, copyProjectDataToPrm, copyRawNanoporeDataToPrm, copyRawNanoporeDataToTmp, checkRawdata]
    notification_target: hpc-helpdesk
    machines: "{{ groups['chaperone'] }}"
  ######################################################################################################################
  # umcg-gd group
  ######################################################################################################################
