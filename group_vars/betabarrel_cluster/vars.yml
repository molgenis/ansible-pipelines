---
#
# Site specific values to override defaults for variables.
#
# Conventions for global environment variables:
# Use UPPERCASE underscore separated names like for shell env vars.
#
# Conventions for playbook variables:
# Use lowercase underscore separated names.
#
stack_prefix: 'bb'
#
# Versions of components of our HPC environment, which is managed using Lua+Lmod+EasyBuild.
# NOTE: when introducing a new version number here for Lua or Lmod,
#       please make sure to add corresponding values in group_vars/all/*.yml
#
lua_version: '5.4.6'
luaposix_version: '36.2.1'
lmod_version: '8.7.32'
easybuild_version: '5.3.0'
eb_user: umcg-envsync
eb_group: umcg-depad
group_module_versions:
  umcg-gd:
    NGS_Automated:
      default: 4.6.0  # Default NGS_Automated version.
      NGS_Demultiplexing: 4.2.0
    nf_ngs_dna: 1.4.0
    ConcordanceCheck: 3.0.0
    ngs-utils: 24.02.2
    vip: v9.2.0
    NGS_Demultiplexing: 2.5.4
    Trendanalysis: 2.1.0
  umcg-genomescan:
    NGS_Automated:
      default: 4.5.0
    nf_ngs_dna: 1.2.0
    NGS_RNA: 4.1.3
    ngs-utils: 24.03.1
  umcg-atd:
    NGS_Automated:
      default: 4.6.0  # Default NGS_Automated version.
    nf_ngs_dna: 1.4.0
    ConcordanceCheck: 3.0.0
    ngs-utils: 24.02.2
    Trendanalysis: 2.1.0
  umcg-gst:
    NGS_Automated:
      default: 4.5.0
    nf_ngs_dna: 1.2.0
    NGS_RNA: 4.1.3
    ngs-utils: 24.02.2
  umcg-labgnkbh:
    NGS_Automated:
      default: 4.6.0
    ngs-utils: 24.02.2
    nf_ngs_dna: 1.4.0
  umcg-patho:
    NGS_Automated:
      default: 4.2.0
    ngs-utils: 24.03.1
  umcg-lab:
    NGS_Automated:
      default: 4.6.0
#
# Sources, software and reference data to install/fetch.
#
public_sources: []
private_sources: []
refdata: [
  'Prepkits',
]
static_easyconfigs:
  - 'c/cluster-utils/cluster-utils-v26.01.1-GCCcore-13.3.0.eb'
  - 'd/depad-utils/depad-utils-v26.04.3.eb'
  - 'c/ConcordanceCheck/ConcordanceCheck-3.0.0.eb'
chaperone_only_easyconfigs: "{{ all_easyconfigs | select('search', '(NGS_Automated-.*-bare|depad-utils-.*).eb') | list }}"
...
